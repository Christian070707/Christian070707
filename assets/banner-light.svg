<svg xmlns="http://www.w3.org/2000/svg" width="880" height="270" viewBox="0 0 880 270" role="img" aria-label="Christian Abdalla, aspiring quantitative developer">
<style>
  text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
  .text { fill: #1f2328; }
  .muted { fill: #656d76; }
  .s11 { font-size: 11px; }
  .s12 { font-size: 12px; }
  .bar { transform-box: fill-box; transform-origin: right center; animation: breathe ease-in-out infinite alternate; }
  @keyframes breathe { from { transform: scaleX(.55); } to { transform: scaleX(1); } }
  .fill { opacity: 0; animation: fill 4.5s ease-out infinite; }
  @keyframes fill { 0%, 70% { opacity: 0; } 74% { opacity: .28; } 100% { opacity: 0; } }
  .pulse { animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .25; } }
  .typer { animation: type 9s infinite; }
  @keyframes type {
    0% { transform: translateX(0); animation-timing-function: steps(31, end); }
    30%, 100% { transform: translateX(297.59999999999997px); }
  }
  .cursor { animation: blink 1s steps(1, end) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .draw { stroke-dasharray: 1400; stroke-dashoffset: 1400; animation: draw 9s ease-out infinite; }
  @keyframes draw { 0% { stroke-dashoffset: 1400; } 45%, 100% { stroke-dashoffset: 0; } }
  .area { opacity: 0; animation: area 9s ease-out infinite; }
  @keyframes area { 0%, 35% { opacity: 0; } 50%, 100% { opacity: 1; } }
  .tip { opacity: 0; animation: area 9s ease-out infinite; }
  @media (prefers-reduced-motion: reduce) {
    .bar, .fill, .pulse, .cursor, .area, .tip { animation: none; opacity: 1; }
    .fill { opacity: 0; }
    .typer { animation: none; transform: translateX(297.59999999999997px); }
    .draw { animation: none; stroke-dashoffset: 0; }
  }
</style>
